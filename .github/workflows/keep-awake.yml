name: Keep the demo awake

# A free Render service sleeps after about fifteen minutes without a request,
# and the first request afterwards waits roughly fifty seconds for the container
# to start. A judge should not meet that. This pings every ten minutes.
#
# It pings /health, which reads local JSON files and opens no database
# connection, so keeping the API awake costs nothing in Neon compute hours.
#
# Actions minutes are free on public repositories; this workflow would be too
# frequent for a private one. GitHub also disables scheduled workflows after 60
# days without repository activity, and can delay a cron under load - neither
# matters over the life of a hackathon demo.
#
# THIS DOES NOT RUN IN A FORK. GitHub disables workflows in forked repositories
# until someone enables them on the Actions tab, and does not run schedule
# events in forks at all. The deployed repository is a fork, so the live demo is
# pinged by an external scheduler (cron-job.org) instead, and this file is kept
# because it is correct the moment the repository leaves the fork network.
# See docs/deploy.md.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        env:
          # A repository variable (Settings > Secrets and variables > Actions >
          # Variables), e.g. https://streamlens-api.onrender.com
          API_URL: ${{ vars.API_URL }}
        run: |
          set -u
          if [ -z "${API_URL}" ]; then
            echo "API_URL is not set, so there is nothing to keep awake."
            echo "Set the API_URL repository variable once the API is deployed."
            exit 0
          fi

          url="${API_URL%/}/health"
          echo "Pinging ${url}"

          # A sleeping free instance can take the better part of a minute to
          # wake, which is the case this workflow exists to prevent, so the
          # timeout is generous and one retry is allowed.
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "${url}" || echo "000")
            if [ "${code}" = "200" ]; then
              echo "OK on attempt ${attempt}"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt ${attempt} returned ${code}"
            sleep 15
          done

          echo "The API did not answer. It may be spun down, redeploying, or over its free hours."
          exit 1
